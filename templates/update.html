<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Update Todo</title>
    <style>
        body {
            background: #f8f7ff;
            color: #191b35;
        }

        .navbar {
            height: 60px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 9%;
            border-bottom: 1px solid #eeeeF8;
        }

        .logo {
            font-size: 17px;
            font-weight: bold;
        }

        .container {
            width: 75%;
            max-width: 650px;
            margin: 70px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 10px;
        }

        p {
            color: #888;
            font-size: 13px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #f1f1ff;
            border: none;
            outline: none;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        button {
            background: #5146ee;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            text-decoration: none;
            color: #5146ee;
            margin-left: 12px;
            font-size: 13px;
        }
    </style>

</head>

<body>
    <div class="navbar">
        <div class="logo">TaskFlow</div>
    </div>
    <div class="container">
        <div class="card">
            <h1>Update Todo</h1>
            <p>Edit your task and save the changes.</p>
            <form method="POST">
                {% csrf_token %}
                <input type="text" name="title" value="{{ task.title }}" required>
                <button type="submit">
                    Update Task
                </button>
                <a href="{% url 'task' %}" class="back">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</body>
</html>
